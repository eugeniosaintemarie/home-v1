<!DOCTYPE HTML>
<html>
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Eugenio Sainte Marie | Diseño & Desarrollo Web</title>
<meta name="description" content="Eugenio Sainte Marie | Diseño & Desarrollo Web"/>
<meta name="keywords" content="Eugenio, Sainte Marie, E. S. M., diseño, desarrollo, web, asesoramiento, portfolio, contacto"/>
<link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" type="ico">
<style>
html, body {
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
}

.main {
  display: flex;
  width: 100%;
  height: 100%;
}

.a,
.b {
  display: flex;
  flex: 1 1 50%;
  height: 100%;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.a {
  background-color: white;
  color: black;
}

.b {
  background-color: black;
  color: white;
}

.aa,
.bb {
  font-family: 'Roboto', sans-serif;
  font-size: 0.75em;
  font-weight: 900;
  text-transform: uppercase;
}

.aa {
  color: black;
}

.aa:hover {
  color: black;
}

.aa:link {
  text-decoration: none;
}

.bb {
  color: white;
}

.bb:hover {
  color: white;
}

.bb:link {
  text-decoration: none;
}

</style>
</head>
<body>
<section class="main">
  <div class="a">
    <p><a class="aa" data-repo="portfolio-v1" href="#"><span><h3>Portfolio</h3></span></a></p>
  </div>
  <div class="b">
    <p><a class="bb" data-repo="advice-v1" href="#"><span><h3>Asesoramiento</h3></span></a></p>
  </div>
</section>
<script>
(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){(i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)})(window,document,'script','https://www.google-analytics.com/analytics.js','ga');ga('create', 'UA-82621918-1', 'auto');ga('send', 'pageview');
</script>
<script>
(() => {
  const siteBaseURL = "https://eugeniosaintemarie.github.io".replace(/\/$/, "");
  const buildRepoURL = (repoName, query = "") => {
    const url = new URL(`${repoName}/`, `${siteBaseURL}/`);
    if (query) {
      url.search = query.startsWith("?") ? query : `?${query}`;
    }
    return url.toString();
  };

  document.querySelectorAll("[data-repo]").forEach((link) => {
    const repoName = link.dataset.repo;
    if (!repoName) {
      return;
    }
    link.href = buildRepoURL(repoName, link.dataset.query || "");
  });
})();
</script>
</body>
</html>
